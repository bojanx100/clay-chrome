<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="live-ui-popup.css">
</head>
<body>
  <div class="header">
    <img src="icons/icon-48.png" alt="Clay" class="logo">
    <h1>Clay</h1>
  </div>

  <div class="section live-ui-card">
    <div class="section-title">
      Live UI
      <span id="liveUiBadge" class="live-ui-badge">Checking</span>
    </div>
    <div id="liveUiTarget" class="live-ui-target">
      <div class="live-ui-target-icon">↗</div>
      <div class="live-ui-target-copy">
        <div id="liveUiTargetTitle" class="live-ui-target-title">Current tab</div>
        <div id="liveUiTargetUrl" class="live-ui-target-url">Checking tab…</div>
      </div>
    </div>

    <div id="liveUiActive" class="live-ui-active hidden">
      <div class="live-ui-active-kicker">Pinned to</div>
      <div id="liveUiActiveSession" class="live-ui-active-session"></div>
      <div id="liveUiActiveProject" class="live-ui-active-project"></div>
      <button id="liveUiExitBtn" class="live-ui-exit">Exit Live UI</button>
    </div>

    <div id="liveUiSetup">
      <div class="live-ui-field">
        <label class="live-ui-label" for="liveUiProjectSelect">Project</label>
        <select id="liveUiProjectSelect" class="live-ui-select"></select>
      </div>
      <div class="live-ui-field">
        <label class="live-ui-label" for="liveUiSessionSelect">Chat</label>
        <select id="liveUiSessionSelect" class="live-ui-select"></select>
      </div>
      <button id="liveUiStartBtn" class="live-ui-start">Start Live UI on this tab</button>
      <button id="liveUiConnectBtn" class="live-ui-connect hidden">Connect this tab as Clay</button>
      <div id="liveUiHint" class="live-ui-hint"></div>
    </div>
    <div id="liveUiStatus" class="live-ui-status" aria-live="polite"></div>
  </div>

  <div class="section">
    <div class="section-title">
      MCP Servers
      <button id="addServerBtn" class="add-btn" title="Add server">+</button>
    </div>
    <div id="serverList" class="server-list">
      <div class="empty-state">No servers configured.</div>
    </div>
  </div>

  <!-- Add Server Form (hidden by default) -->
  <div id="addForm" class="section add-form hidden">
    <div class="section-title">Add Server</div>
    <input type="text" id="serverName" placeholder="Name (e.g. github)" spellcheck="false">
    <input type="text" id="serverPackage" placeholder="npm package (e.g. @modelcontextprotocol/server-github)" spellcheck="false">
    <input type="text" id="serverArgs" placeholder="Additional args (e.g. /home/user/projects)" spellcheck="false">
    <div id="envFields" class="env-fields"></div>
    <button id="addEnvBtn" class="link-btn">+ Add env variable</button>
    <div class="form-actions">
      <button id="cancelAddBtn" class="btn-secondary">Cancel</button>
      <button id="saveServerBtn" class="btn-primary">Add</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Import External Config</div>
    <div class="config-row">
      <input type="text" id="importPath" placeholder="~/.claude/claude_desktop_config.json" spellcheck="false">
      <button id="importBtn" title="Import">Import</button>
    </div>
    <div id="importStatus" class="status"></div>
    <div id="importedPaths" class="imported-paths"></div>
  </div>

  <div class="section">
    <div class="section-title">Native Host</div>
    <div id="hostStatus" class="status">
      <span class="dot dot-unknown"></span>
      <span>Checking...</span>
    </div>
  </div>

  <script src="live-ui-popup.js"></script>
  <script src="popup.js"></script>
</body>
</html>
